<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="robots" content="noindex" />
    <title>Bağlantı yok · Randera</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Bu dosya bilinçli olarak tek parça (self-contained): service worker ağ
      yokken gezinme isteklerine bunu döndürür. Hiçbir JS/CSS dosyasına bağımlı
      OLMAMALIDIR; aksi halde çevrimdışıyken stil ve içerik yüklenemez ve
      kullanıcı boş bir sayfa görür.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --brand: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0d14;
          --card: #0f172a;
          --text: #f1f5f9;
          --muted: #94a3b8;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      .box {
        width: 100%;
        max-width: 22rem;
      }
      .icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 4rem;
        height: 4rem;
        margin: 0 auto;
        border-radius: 1.75rem;
        background: var(--card);
        box-shadow: 0 8px 30px rgb(15 23 42 / 0.08);
      }
      svg {
        width: 1.75rem;
        height: 1.75rem;
        color: var(--brand);
      }
      h1 {
        margin: 1rem 0 0;
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0.5rem 0 0;
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--muted);
      }
      button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.25rem;
        padding: 0.7rem 1.4rem;
        border: 0;
        border-radius: 1rem;
        background: linear-gradient(90deg, #6366f1, #9333ea);
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 20px rgb(99 102 241 / 0.3);
      }
      button:active {
        transform: scale(0.96);
      }
      .hint {
        margin-top: 0.75rem;
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 20h.01" />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
          <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
          <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>İnternet bağlantısı yok</h1>
      <p>
        Bağlantın geri geldiğinde tekrar dene. Daha önce açtığın sayfalar
        önbellekten görüntülenmeye devam eder.
      </p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
      <p class="hint">
        <span lang="en">No internet connection. Please try again.</span>
      </p>
    </div>
  </body>
</html>
